<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Forms Exercise</title>
  </head>
  <body>
    <h2>Registration Form</h2>

    <form method="POST" action="https://formspree.io/f/xpwzpzrd">
      <label>First Name:</label>
      <input type="text" name="first_name" /><br /><br />

      <label>Last Name:</label><br />
      <input type="text" name="last_name" /><br /><br />

      <label>Gender:</label><br />
      <input type="radio" name="gender" value="Male" /> Male<br />
      <input type="radio" name="gender" value="Female" /> Female<br /><br />

      <label>Date of Birth:</label><br />
      <input type="date" name="date_of_birth" /><br /><br />

      <label>Email:</label><br />
      <input type="email" name="email" /><br /><br />

      <input type="submit" value="Register" />
    </form>

    <hr />

    <h2>Search Form</h2>
    <!-- output will be in raw JSON format, just in case it looks all weird lol-->

    <form method="GET" action="https://httpbin.org/get">
      <label>Search:</label><br />
      <input type="text" name="search_name" /><br /><br />

      <input type="submit" value="Search" />
    </form>
  </body>
</html>
